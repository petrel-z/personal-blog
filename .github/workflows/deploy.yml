name: Deploy to Server

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  ci_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Authorization regression tests
        run: pnpm test --runInBand

      - name: Build
        run: pnpm build

  deploy_to_main:
    runs-on: ubuntu-latest
    needs: ci_checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -eu
            export PATH="/opt/node/node-v20.19.6-linux-x64/bin:$PATH"

            for tool in node corepack pnpm pm2; do
              command -v "$tool"
            done

            cd /root/blog
            git pull origin main
            corepack enable
            pnpm install --frozen-lockfile
            pnpm prisma db push
            pnpm prisma generate
            pnpm build
            pm2 restart blog

  create_pr_from_dev_to_main:
    runs-on: ubuntu-latest
    needs: ci_checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: create-pr-dev-to-main
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          existing_pr=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head dev \
            --state open \
            --json url \
            --jq '.[0].url // empty')

          if [[ -n "$existing_pr" ]]; then
            echo "Pull request already exists: $existing_pr"
            exit 0
          fi

          commits_ahead=$(git rev-list --count origin/main..origin/dev)
          if [[ "$commits_ahead" -eq 0 ]]; then
            echo "No commits to merge from dev into main; skipping pull request creation."
            exit 0
          fi

          body_file="$RUNNER_TEMP/dev-to-main-pr-body.md"
          cat > "$body_file" <<'EOF'
          This is an automated pull request to merge changes from `dev` to `main` after `dev` branch CI checks passed.
          Please review and merge.
          EOF

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head dev \
            --title "Automated PR: Merge dev to main" \
            --body-file "$body_file"
